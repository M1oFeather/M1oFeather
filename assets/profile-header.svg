    <text x="0" y="194" fill="#70dff2" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="1.8">MODS  •  LOCAL-FIRST SYSTEMS  •  AI TOOLING</text>
    <text x="0" y="224" fill="#718096" font-family="Consolas, Menlo, monospace" font-size="13">Code constructs the world; data records everything.</text>
